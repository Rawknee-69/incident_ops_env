[project]
name = "incident_ops_env"
version = "1.0.0"
description = "OpenEnv environment for production incident response RL training"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.54.0",
    "google-generativeai>=0.8.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "openenv-core>=0.1.1",
    "websockets>=13.0",
    "prometheus-client>=0.21.0",
    "gradio>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
incident-ops-env = "incident_ops_env.server.entrypoint:main"
server = "incident_ops_env.server.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["incident_ops_env"]
